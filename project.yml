name: FilmDev
options:
  bundleIdPrefix: com.filmdev
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    PRODUCT_BUNDLE_IDENTIFIER: com.filmdev.app

targets:
  FilmDev:
    type: application
    platform: macOS
    sources:
      - path: FilmDev
        excludes:
          - "**/.DS_Store"
    resources:
      - path: FilmDev/Resources/Assets.xcassets
      - path: FilmDev/Resources/LUTs
    settings:
      base:
        PRODUCT_NAME: FilmDev
        INFOPLIST_FILE: FilmDev/Info.plist
        CODE_SIGN_ENTITLEMENTS: FilmDev/FilmDev.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    info:
      path: FilmDev/Info.plist
      properties:
        CFBundleName: FilmDev
        CFBundleDisplayName: FilmDev
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: RAW Image
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.sony.arw-raw-image
              - public.camera-raw-image
              - com.adobe.raw-image
            LSHandlerRank: Alternate
    entitlements:
      path: FilmDev/FilmDev.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
